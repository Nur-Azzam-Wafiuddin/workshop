[project]
name = "workshop-genai-migas"
version = "0.2.0"
description = "Materi hands-on Workshop Generative AI, RAG, dan Agentic AI untuk industri migas (data fiktif)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "migas_shared"]
